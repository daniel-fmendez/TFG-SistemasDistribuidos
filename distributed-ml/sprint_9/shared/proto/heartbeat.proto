syntax = "proto3";

package heartbeat;

service HeartbeatService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
message HeartbeatResponse {
  int64 timestamp = 1;
  bool ack = 2;
}

message HeartbeatRequest {
  int64 timestamp = 1;
  string worker_id = 2;
  float cpu_usage = 3;
  float memory_usage = 4;
  float memory_mb = 5;
}